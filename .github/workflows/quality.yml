name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-persistence:
    name: Build and persistence
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show Swift version
        run: swift --version
      - name: Build with resolved dependencies
        run: swift build --force-resolved-versions
      - name: Run persistence checks
        run: swift run --skip-build MinorityPersistenceChecks
